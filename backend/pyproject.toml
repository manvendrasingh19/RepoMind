[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]
